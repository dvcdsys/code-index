services:
  code-index-api:
    image: dvcdsys/code-index:cu128
    container_name: code-index
    restart: unless-stopped
    ports:
      - "21847:21847"
    environment:
      - CIX_API_KEY=${API_KEY}
      - CIX_EMBEDDING_MODEL=${EMBEDDING_MODEL:-awhiteside/CodeRankEmbed-Q8_0-GGUF}
      # Legacy chromem-go store: read once on startup for the one-time import
      # into the SQLite vector store, then left untouched as the rollback path.
      - CIX_CHROMA_PERSIST_DIR=/data/chroma
      # Optional. Vector store: one SQLite database per embedding namespace.
      # Defaults to a sibling of CIX_CHROMA_PERSIST_DIR (/data/vectors), so it
      # already lands on the data volume — set it only to move the vectors to
      # a different mount.
      # - CIX_VECTORS_DIR=/data/vectors
      # Optional. PRAGMA mmap_size for the vector store, in bytes; 0 (default)
      # is off. Roughly 40% lower search latency in exchange for resident
      # memory — mapped database pages count in RSS, per connection.
      # - CIX_VECTOR_MMAP_SIZE=2147483648
      - CIX_SQLITE_PATH=/data/sqlite/projects.db
      - CIX_MAX_FILE_SIZE=${MAX_FILE_SIZE:-524288}
      - CIX_EXCLUDED_DIRS=${EXCLUDED_DIRS:-node_modules,.git,.venv,__pycache__,dist,build,.next,.cache,.DS_Store}
      - CIX_N_GPU_LAYERS=99
      - CIX_LLAMA_STARTUP_TIMEOUT=120
      - CIX_GGUF_CACHE_DIR=/data/models
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - cix_data:/data
    deploy:
      resources:
        limits:
          memory: 10G
        reservations:
          memory: 2G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["/cix-server", "-healthcheck"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3

volumes:
  cix_data:
    driver: local
