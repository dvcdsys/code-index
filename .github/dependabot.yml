version: 2

# Tracks the post-migration layout: Go server (/server), Go CLI (/cli), the
# dashboard npm app (/server/dashboard), the server Docker images, and the
# workflows. The Python backend under legacy/python-api is ARCHIVED
# (read-only, not built or deployed) so it is intentionally NOT scanned —
# version bumps there are pure noise. Security updates still run repo-wide
# regardless of this config.

updates:
  # Go — server (cix-server)
  - package-ecosystem: "gomod"
    directory: "/server"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      go:
        patterns: ["*"]
    labels:
      - "dependencies"
      - "go"

  # Go — CLI (cix)
  - package-ecosystem: "gomod"
    directory: "/cli"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      go:
        patterns: ["*"]
    labels:
      - "dependencies"
      - "go"

  # npm — dashboard (server/dashboard)
  - package-ecosystem: "npm"
    directory: "/server/dashboard"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns: ["*"]
        # Group only minor/patch so the weekly PR stays safe to merge. The
        # dashboard build is not exercised on PRs (only on the develop
        # pre-release image), so a grouped mega-bump can silently break it.
        update-types: ["minor", "patch"]
    # Frontend majors (React 19, Tailwind 4, Vite 8, react-router 7, TS 6, …)
    # are deliberate migrations — code changes + manual build validation — so
    # Dependabot does not open them automatically. Bump them by hand when chosen.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"
      - "javascript"

  # npm — marketing site (site/). Build-time toolchain only (Astro, wrangler,
  # sharp) — nothing here is served to visitors, but the lockfile still
  # accumulates HIGH advisories that previously only ever surfaced as alerts
  # because this directory had no Dependabot entry at all.
  - package-ecosystem: "npm"
    directory: "/site"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"
      - "javascript"

  # Docker — server images (server/Dockerfile + server/Dockerfile.cuda)
  - package-ecosystem: "docker"
    directory: "/server"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "docker"
    ignore:
      # The llama.cpp CUDA image is DELIBERATELY pinned by digest in
      # Dockerfile.cuda. Upstream refactors the shared-library layout between
      # builds (the server logic moved into libllama-server-impl.so), so a blind
      # digest bump silently breaks the runtime .so COPY → llama-server exit 127;
      # this took prod down once. Bump it manually via the documented process
      # (edit the digest + `make scout-cuda` + GPU E2E), not via Dependabot.
      # Drift is surfaced by the check-llama-pin.sh warn job (llama-pin-check.yml).
      - dependency-name: "ghcr.io/ggml-org/llama.cpp"
      # The nvidia/cuda base is deliberately pinned and coupled to
      # version-specific apt package names (libcublas-12-8) in Dockerfile.cuda —
      # even a MINOR bump (12.8→12.9) breaks the apt install, and a CUDA move
      # needs the prod RTX 3090 driver + `make scout-cuda`. Bump it by hand, so
      # ignore all update types (not just major).
      - dependency-name: "nvidia/cuda"
      # node is the dashboard build-stage image: stay on the active LTS (24).
      # node 26 is "Current" until ~2026-10; adopt it deliberately once it's LTS.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "ci"
    ignore:
      # codeql-action is referenced as the floating major tag `@v4` on
      # purpose, which is how GitHub documents consuming it: they cut
      # releases continuously, and a frozen minor silently goes stale.
      # Dependabot reads `@v4` as "pin me to an exact minor", so it keeps
      # proposing a downgrade -- its last such PR offered v4.37.4 while
      # `@v4` already resolved to v4.39.2, twelve releases newer. An exact
      # minor tag is mutable too, so the pin would buy no supply-chain
      # integrity either; only a SHA would, and that is a separate decision.
      # Majors are NOT ignored: v3 -> v4 changes the runner contract and
      # must stay visible.
      - dependency-name: "github/codeql-action"
        update-types:
          ["version-update:semver-minor", "version-update:semver-patch"]
