name: "Release: Server"

# Triggered by server-namespaced tags (e.g. `server/v0.3.0`).
# Builds CPU (multi-arch) and CUDA (amd64-only) Docker images and
# publishes them to Docker Hub, then creates the GitHub release.
#
# `workflow_dispatch` allows rebuilding an existing released version
# without cutting a new tag (e.g. to refresh attestations or pick up
# a new base image). The GitHub release step is skipped on dispatch.
on:
  push:
    tags:
      - "server/v*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (tag like `server/v0.4.0` or a SHA)"
        required: true
        type: string
      version:
        description: "Version string for image tags (e.g. `v0.4.0`)"
        required: true
        type: string
      update_floating_tags:
        description: "Also push `:latest` and `:cu128` floating tags"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  docker-cpu:
    name: Build CPU image (multi-arch)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Extract version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "floating=${{ github.event.inputs.update_floating_tags }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#server/}" >> "$GITHUB_OUTPUT"
            echo "floating=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Compose tags
        id: tags
        run: |
          tags="dvcdsys/code-index:${{ steps.ver.outputs.version }}"
          if [ "${{ steps.ver.outputs.floating }}" = "true" ]; then
            tags="$tags
          dvcdsys/code-index:latest"
          fi
          {
            echo 'tags<<EOF'
            echo "$tags"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to Docker Hub
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: server
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          build-args: VERSION=${{ steps.ver.outputs.version }}
          # `openapi=doc` mounts the repo-root doc/ folder so the dashboard
          # build stage can `COPY --from=openapi openapi.yaml` without us
          # widening the primary build context (which is `server/`).
          build-contexts: |
            openapi=doc
          tags: ${{ steps.tags.outputs.tags }}

  docker-cuda:
    name: Build CUDA image (amd64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Extract version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "floating=${{ github.event.inputs.update_floating_tags }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#server/}" >> "$GITHUB_OUTPUT"
            echo "floating=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Compose tags
        id: tags
        run: |
          tags="dvcdsys/code-index:${{ steps.ver.outputs.version }}-cu128"
          if [ "${{ steps.ver.outputs.floating }}" = "true" ]; then
            tags="$tags
          dvcdsys/code-index:cu128"
          fi
          {
            echo 'tags<<EOF'
            echo "$tags"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Reminder (never fails the build) when upstream llama.cpp has moved past
      # the digest pinned in Dockerfile.cuda — keeps the deliberate pin honest.
      - name: Warn if pinned llama.cpp is stale
        run: server/scripts/check-llama-pin.sh server/Dockerfile.cuda

      - name: Login to Docker Hub
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: server
          file: server/Dockerfile.cuda
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          build-args: VERSION=${{ steps.ver.outputs.version }}
          # `openapi=doc` mounts the repo-root doc/ folder so the dashboard
          # build stage can `COPY --from=openapi openapi.yaml` without us
          # widening the primary build context (which is `server/`).
          build-contexts: |
            openapi=doc
          tags: ${{ steps.tags.outputs.tags }}

  macos-runtime:
    name: Build macOS runtime (arm64)
    # The same server, packaged for a Mac instead of a container: cix-server,
    # the cix CLI and a Metal llama-server, installed by cix.app into
    # ~/.cix/runtime/<version>/. It ships from THIS tag, not from mac/v*, so a
    # Mac and a container on the same version are running the same server.
    #
    # macos-latest is arm64, and it has to be: upstream llama.cpp publishes one
    # macOS asset, macos-arm64, so there is no x86_64 build to make.
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          # Full history: the CLI version comes from `git describe` against a
          # tag that is not the tag being built.
          fetch-depth: 0

      - name: Resolve versions
        id: ver
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SERVER_VERSION="${{ github.event.inputs.version }}"
          else
            SERVER_VERSION="${GITHUB_REF_NAME#server/}"
          fi
          # The Docker tags are v-prefixed; the runtime version is not. It
          # becomes a directory name under ~/.cix/runtime/ and is compared
          # against the tag stream with the prefix already stripped.
          SERVER_VERSION="${SERVER_VERSION#v}"

          CLI_TAG="$(git describe --tags --match 'cli/v*' --abbrev=0 2>/dev/null || true)"
          if [ -z "$CLI_TAG" ]; then
            echo "::error title=No CLI version::The runtime bundles the cix CLI, and no cli/v* tag is reachable from this commit — it would ship stamped 0.0.0-dev. Cut server/v* tags on main."
            exit 1
          fi

          {
            echo "server=$SERVER_VERSION"
            echo "cli=${CLI_TAG#cli/v}"
          } >> "$GITHUB_OUTPUT"

          echo "server=$SERVER_VERSION cli=$CLI_TAG"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: |
            server/go.sum
            cli/go.sum

      - name: Set up Node
        # The server binary embeds the built dashboard via go:embed, so this
        # needs the frontend toolchain even though nothing here is JavaScript.
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/dashboard/package-lock.json

      - name: Build the runtime
        env:
          SERVER_VERSION: ${{ steps.ver.outputs.server }}
          CLI_VERSION: ${{ steps.ver.outputs.cli }}
        # The script round-trips the tarball it writes before returning:
        # extract, codesign --verify --strict every Mach-O, check llama-server's
        # @rpath dependencies, and exec the server. That check is in the script
        # rather than here so local builds get it too, and because the failure
        # it catches is silent — a signature the kernel rejects is SIGKILL with
        # empty stderr.
        run: mac/scripts/build-runtime.sh

      - name: Upload the runtime
        uses: actions/upload-artifact@v7
        with:
          name: cix-runtime-darwin-arm64
          path: mac/dist/*.tar.gz

  prune:
    name: Prune stale Docker Hub tags
    needs: [docker-cpu, docker-cuda]
    runs-on: ubuntu-latest
    # Only on real release tags (always the newest version, so keep-N never
    # reaps what we just pushed). Skipped on workflow_dispatch rebuilds of an
    # older version, which a keep-newest policy would otherwise delete.
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prune old tags (keep newest 3 releases + floating)
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKER_PASSWORD }}
          DRY_RUN: "false"
          KEEP_RELEASES: "3"
        run: server/scripts/dockerhub-prune.sh

  release:
    name: Publish release
    # macos-runtime is a hard dependency, not a nicety: cix.app installs its
    # server from this release's assets, so a release published without the
    # runtime attached is one no Mac can install or update to.
    needs: [docker-cpu, docker-cuda, macos-runtime]
    runs-on: ubuntu-latest
    # Skip GitHub release creation on manual rebuilds — the release
    # already exists for the version being rebuilt.
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#server/}" >> "$GITHUB_OUTPUT"

      - name: Download the macOS runtime
        uses: actions/download-artifact@v8
        with:
          name: cix-runtime-darwin-arm64
          path: dist

      - name: Compute checksums
        working-directory: dist
        # cix.app verifies its download against this file. Without a Developer
        # ID signature it is the only integrity check there is.
        #
        # sha256sum, not shasum: this job runs on ubuntu, and that is what
        # release-cli.yml uses there. The macOS jobs use shasum because macOS
        # ships no sha256sum. Same output format either way.
        run: sha256sum ./*.tar.gz > checksums.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: "Server ${{ steps.ver.outputs.version }}"
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/checksums.txt
          body: |
            ## Docker Images

            | Tag | Image |
            |---|---|
            | CPU (multi-arch) | `dvcdsys/code-index:${{ steps.ver.outputs.version }}` |
            | CUDA 12.8 | `dvcdsys/code-index:${{ steps.ver.outputs.version }}-cu128` |

            ## macOS (Apple Silicon)

            The same server for a Mac, installed and managed by
            [cix.app](https://github.com/dvcdsys/code-index/releases?q=mac%2Fv).
            The app downloads it on its own — the tarball is attached so the
            checksums cover it, not because it needs downloading by hand.

            | Asset | Contents |
            |---|---|
            | `cix-runtime-*-darwin-arm64.tar.gz` | `cix-server`, the `cix` CLI, Metal `llama-server` |

  site-version:
    name: Check the site advertises this release
    needs: [docker-cpu, docker-cuda]
    runs-on: ubuntu-latest
    # The marketing site (site/) is a surface nothing else in a release
    # touches, so it silently keeps advertising the previous version —
    # versions.js still said 0.12.2 the moment server/v0.12.3 shipped.
    # ci-site.yml hard-fails on a stale versions.js, but it only triggers on
    # site/** changes, so a server release never runs it. This job closes that
    # gap at release time.
    #
    # Deliberately NON-BLOCKING: versions.js may only name a version that is
    # already tagged, so the bump legitimately lands *after* this tag exists.
    # The warning is the reminder to go do it, not a failure.
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compare site versions.js with the released version
        run: |
          # The site lives on its own branch until it merges; skip until then.
          if [ ! -f site/src/shared/versions.js ]; then
            echo "no site/src/shared/versions.js at this ref — nothing to check"
            exit 0
          fi
          RELEASED="${GITHUB_REF_NAME#server/}"; RELEASED="${RELEASED#v}"
          SITE=$(grep -oE "^export const SERVER_VERSION = '[^']+'" site/src/shared/versions.js | cut -d"'" -f2)
          echo "released=$RELEASED  site=$SITE"
          if [ "$SITE" = "$RELEASED" ]; then
            echo "site already advertises $RELEASED — nothing to do"
            echo "Site already advertises \`$RELEASED\`." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::warning title=Site version is stale::site/src/shared/versions.js still says $SITE — bump SERVER_VERSION to $RELEASED so the published site stops advertising the previous release."
          {
            echo "### ⚠️ Site still advertises \`$SITE\`"
            echo ""
            echo "\`server/v$RELEASED\` just shipped. Bump \`SERVER_VERSION\` in"
            echo "\`site/src/shared/versions.js\` to \`$RELEASED\`, or the deployed"
            echo "site keeps showing the previous release."
            echo ""
            echo "\`ci-site.yml\` fails until this is done."
          } >> "$GITHUB_STEP_SUMMARY"
