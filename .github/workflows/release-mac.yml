name: "Release: macOS app"

# Triggered by macOS-app tags (e.g. `mac/v0.1.0`). This is a third, independent
# tag stream alongside `server/v*` and `cli/v*`: the .app is versioned by what
# the app itself does, not by the versions of the two binaries it happens to
# bundle. Those are stamped separately (see the "Resolve versions" step) and
# recorded in the bundle's Info.plist.
#
# Cut these tags on `main`. `git describe` walks ancestors, so a tag cut on
# develop resolves to whatever server/v* is reachable from there — which on this
# repo has been several releases behind what actually shipped.
on:
  push:
    tags:
      - "mac/v*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Ref to build (branch, tag, or SHA)"
        required: true
      version:
        description: "App version, without the mac/v prefix (e.g. 0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build cix.app + DMG
    # The bundled llama-server is macOS arm64 only (upstream ships no macOS
    # x86_64 asset), so the whole app is Apple Silicon only and must be built
    # natively. macos-latest is arm64.
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          # Full history: the server and CLI versions come from `git describe`
          # against tags that are not the tag being built.
          fetch-depth: 0

      - name: Resolve versions
        id: ver
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MAC_VERSION="${{ github.event.inputs.version }}"
          else
            MAC_VERSION="${GITHUB_REF_NAME#mac/v}"
          fi

          SERVER_TAG="$(git describe --tags --match 'server/v*' --abbrev=0 2>/dev/null || true)"
          CLI_TAG="$(git describe --tags --match 'cli/v*' --abbrev=0 2>/dev/null || true)"

          # Guard, not a nicety. Without a reachable tag on each stream the
          # binaries would ship stamped 0.0.0-dev, which is indistinguishable
          # from a local developer build and useless in a bug report.
          if [ -z "$SERVER_TAG" ] || [ -z "$CLI_TAG" ]; then
            echo "::error title=Unreleasable commit::A mac/v* tag must be cut from a commit with both a server/v* and a cli/v* tag reachable. Found server='${SERVER_TAG:-none}' cli='${CLI_TAG:-none}'. Cut the tag on main."
            exit 1
          fi

          {
            echo "mac=$MAC_VERSION"
            echo "server=${SERVER_TAG#server/v}"
            echo "cli=${CLI_TAG#cli/v}"
          } >> "$GITHUB_OUTPUT"

          echo "app=$MAC_VERSION server=$SERVER_TAG cli=$CLI_TAG"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # The server module has the higher `go` directive of the two, and a
          # newer toolchain builds the CLI module fine. One install, both builds.
          go-version-file: server/go.mod
          cache-dependency-path: |
            server/go.sum
            cli/go.sum

      - name: Set up Node
        # The server binary embeds the built dashboard via go:embed, so a
        # release build needs the frontend toolchain even though nothing about
        # the .app is JavaScript.
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/dashboard/package-lock.json

      - name: Build cix.app
        env:
          MAC_VERSION: ${{ steps.ver.outputs.mac }}
          SERVER_VERSION: ${{ steps.ver.outputs.server }}
          CLI_VERSION: ${{ steps.ver.outputs.cli }}
        run: mac/scripts/build-app.sh

      - name: Verify the bundle
        run: |
          set -euo pipefail
          APP=mac/dist/cix.app

          # Ad-hoc signatures do not satisfy Gatekeeper, but they do have to be
          # internally consistent — --strict is what catches a bundle whose
          # sealed resources drifted from what is on disk.
          codesign --verify --strict --verbose=2 "$APP"

          # Each binary reports its own version. This is the check that catches
          # a bundle assembled from stale server/dist artefacts.
          "$APP/Contents/MacOS/cix-launcher" -report

          # Every @rpath dependency of llama-server must be present. Missing
          # ones only fail at dyld load time, on the user's machine, with an
          # abort — which is how the b10238 library-layout change was found.
          missing=0
          for dep in $(otool -L "$APP/Contents/MacOS/llama/llama-server" \
                        | awk '/@rpath\//{sub(/^.*@rpath\//,"",$1); print $1}'); do
            if [ ! -e "$APP/Contents/MacOS/llama/$dep" ]; then
              echo "::error title=Broken bundle::llama-server dependency not bundled: $dep"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      - name: Build DMG
        env:
          MAC_VERSION: ${{ steps.ver.outputs.mac }}
        run: mac/scripts/make-dmg.sh

      - name: Compute checksums
        working-directory: mac/dist
        # The self-updater (a later release) verifies a downloaded DMG against
        # this file. Without a Developer ID signature it is the only integrity
        # check there is, so it ships from the first release onward.
        run: shasum -a 256 ./*.dmg > checksums.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cix-macos-arm64
          path: |
            mac/dist/*.dmg
            mac/dist/checksums.txt

      - name: Create GitHub release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: "macOS app ${{ steps.ver.outputs.mac }}"
          files: |
            mac/dist/*.dmg
            mac/dist/checksums.txt
          generate_release_notes: true
          # Server releases own the "latest" pointer — the Docker image is the
          # primary deliverable of this project. Mac installs filter by the
          # `mac/` tag prefix.
          make_latest: "false"
          body: |
            ## cix for macOS — Apple Silicon

            Bundles `cix-server` ${{ steps.ver.outputs.server }}, the `cix` CLI
            ${{ steps.ver.outputs.cli }}, and a Metal-accelerated `llama-server`
            for local embeddings. Everything runs on your machine.

            ### Install

            1. Download the `.dmg` below and open it.
            2. Drag **cix.app** onto **Applications**.
            3. Open it from Applications.

            ### First launch will be blocked — this is expected

            cix is open source and is **not** signed with a paid Apple Developer
            certificate, so macOS refuses the first launch with "cix cannot be
            verified".

            To allow it: **System Settings → Privacy & Security**, scroll to
            **Security**, then click **Open Anyway** next to the message about cix.

            On macOS 15 and later the old right-click → Open shortcut no longer
            works — you have to use System Settings. You only need to do this
            once per installed version.

            ### Verify the download

            ```bash
            shasum -a 256 -c checksums.txt
            ```

            Requires macOS 13 or later on Apple Silicon. There is no Intel build:
            upstream llama.cpp publishes no macOS x86_64 release asset.
