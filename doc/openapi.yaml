openapi: 3.0.3
info:
  title: cix-server API
  version: v1
  description: |
    HTTP API for the `cix-server` semantic code-index daemon.

    The wire format is byte-stable across server versions; the `api_version`
    field in `/api/v1/status` ticks independently from `server_version` when
    a backwards-incompatible change lands.

    ## Authentication

    Two parallel auth paths back the same identity model:

    - **Browsers / dashboard**: `POST /api/v1/auth/login` with email +
      password issues an HttpOnly cookie `cix_session`. The cookie is sent
      automatically on subsequent same-origin requests. Sessions roll
      forward 14 days from the last request.
    - **CLI / SDK**: `Authorization: Bearer <api_key>` where the key was
      issued by `POST /api/v1/api-keys`. Keys are owner-scoped and can be
      revoked individually without affecting other clients.

    Public endpoints (no auth required): `GET /health`, `GET /docs`,
    `GET /openapi.yaml`, `GET /api/v1/auth/bootstrap-status`,
    `POST /api/v1/auth/login`. Setting `CIX_AUTH_DISABLED=true` skips the
    check on every endpoint (development only — a warning is logged).

    When the server starts with an empty users table it requires
    `CIX_BOOTSTRAP_ADMIN_EMAIL` + `CIX_BOOTSTRAP_ADMIN_PASSWORD` to seed
    the first admin (forced to change password on first login). A legacy
    `CIX_API_KEY` set on a fresh database is imported as a single
    `env-bootstrap` API key owned by that admin.

    ## Project addressing

    Project `host_path` values contain slashes that cannot be embedded in
    URL segments cleanly, so project-scoped endpoints take a `{path}` URL
    parameter that is the **first 16 hex chars of `SHA1(host_path)`**.
    Compute it with `internal/projects.HashPath`.

    ## Streaming indexing

    `POST /api/v1/projects/{path}/index/files` honours the `Accept` header:
    sending `Accept: application/x-ndjson` switches the response to a
    newline-delimited stream of `IndexProgressEvent` objects, with a
    `heartbeat` event every 10 seconds. Old clients that send no Accept
    header (or `application/json`) get the legacy single-JSON response.

    ## Errors

    All error responses use the same body shape: `{"detail": "<message>"}`.
    `GET /health` is the only exception — the unhealthy variant additionally
    carries `{"reason": "..."}`.

servers:
  # Relative URL — Swagger UI's "Try it out" sends requests to whatever
  # origin served /openapi.json, so localhost:8001, localhost:21847, and a
  # remote deployment all just work without CORS preflight surprises.
  - url: /
    description: Same-origin (auto-detected from the URL serving this spec)

security:
  - bearerAuth: []

tags:
  - name: probe
    description: Health and status probes
  - name: projects
    description: Project lifecycle (CRUD)
  - name: search
    description: Symbol, definition, reference, file, and semantic search
  - name: indexing
    description: Three-phase indexing protocol
  - name: docs
    description: API documentation
  - name: auth
    description: Sessions, login/logout, password change, current user
  - name: admin
    description: Admin-only user management
  - name: api-keys
    description: Issue and revoke owner-scoped API keys for CLI/SDK use
  - name: workspaces
    description: |
      Workspaces group GitHub repositories for cross-project semantic search.
      Server-wide shared — every authenticated user can list, create, and
      modify any workspace. PR1 ships CRUD only; repository attachment,
      webhooks, and the two-stage search endpoint land in subsequent
      releases of the workspaces feature branch.
  - name: groups
    description: |
      View-groups: admin-managed sets of users. External projects and
      workspaces are shared to a group, granting its members read/search
      access. Group CRUD and membership are admin-only; GET /groups is
      member-scoped for regular users so the share picker can populate.
  - name: github-tokens
    description: |
      GitHub Personal Access Tokens used by the workspaces feature for
      cloning private repos and (optionally) registering webhooks. Stored
      encrypted-at-rest via AES-GCM; the plaintext is surfaced exactly
      once on POST and never returned thereafter.
  - name: tunnels
    description: |
      Managed Tunnels — a server-orchestrated outbound tunnel that gives
      the server a public URL while it sits behind NAT. Cloudflare Tunnel
      ships now; ngrok is reserved. The live tunnel URL is the preferred
      origin for GitHub webhook delivery URLs.

paths:
  /health:
    get:
      operationId: getHealth
      tags: [probe]
      summary: Liveness probe (public)
      description: |
        Returns `{"status":"ok"}` when the server can reach SQLite within 1
        second. Returns 503 with `{"status":"unhealthy","reason":"..."}` when
        the DB ping fails. Public — no `Authorization` header required.
      security: []
      responses:
        "200":
          description: Server is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Server is unhealthy (e.g. DB unreachable)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/v1/status:
    get:
      operationId: getStatus
      tags: [probe]
      summary: Server / sidecar status (authenticated)
      description: |
        Returns server metadata: version, configured embedding model, whether
        the llama-server sidecar is reachable (`model_loaded`), number of
        registered projects, and number of currently-running indexing jobs.
      responses:
        "200":
          description: Status payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/bootstrap-status:
    get:
      operationId: getBootstrapStatus
      tags: [auth]
      summary: Whether the dashboard needs first-run bootstrap (public)
      description: |
        Returns `{"needs_bootstrap": true}` when the users table is empty.
        The dashboard renders an explanatory screen in that case ("ask the
        operator to deploy with CIX_BOOTSTRAP_ADMIN_* env vars and
        restart"). No authentication required.
      security: []
      responses:
        "200":
          description: Bootstrap status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BootstrapStatusResponse"

  /api/v1/auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Exchange email + password for a session cookie (public)
      description: |
        On success, sets `Set-Cookie: cix_session=<id>; HttpOnly;
        SameSite=Strict; Path=/`. Returns the user payload plus a
        `must_change_password` flag — when true, the dashboard forces a
        change-password screen before any other action.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Session cookie (HttpOnly, SameSite=Strict)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the current session
      description: |
        Deletes the server-side session row and instructs the browser to
        clear `cix_session` via `Set-Cookie: cix_session=; Max-Age=0`.
      responses:
        "204":
          description: Session ended
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Current authenticated user
      description: |
        Returns the user attached to the active session OR API key.
        Includes `must_change_password` so the dashboard knows whether to
        gate further navigation behind a change-password screen.
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/change-password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change the current user's password
      description: |
        Verifies `current_password`, updates to `new_password`, clears
        `must_change_password`, and revokes every other session of this
        user (the cookie carrying the change-password request is kept
        alive). Does NOT touch API keys — those are revoked individually.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Password updated
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/auth/sessions:
    get:
      operationId: listMySessions
      tags: [auth]
      summary: Active sessions of the current user
      description: |
        Returns every non-expired session of the caller, newest-first, with
        `last_seen_at`, `last_seen_ip`, and `last_seen_ua` so the user can
        spot unfamiliar logins. The `is_current` flag marks the session
        carrying this request.
      responses:
        "200":
          description: Session list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/sessions/{id}:
    delete:
      operationId: deleteMySession
      tags: [auth]
      summary: End one of my sessions (sign out a single device)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Session ended
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/users:
    get:
      operationId: listUsers
      tags: [admin]
      summary: List all users (admin only)
      responses:
        "200":
          description: User list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createUser
      tags: [admin]
      summary: Invite a new user (admin only)
      description: |
        The admin sets an `initial_password` and shares it out-of-band.
        The new user is flagged `must_change_password=true` and will be
        forced to change it on first login.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/admin/users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: updateUser
      tags: [admin]
      summary: Change role or disabled flag (admin only)
      description: |
        Refuses to demote or disable the last enabled admin in the system.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
    delete:
      operationId: deleteUser
      tags: [admin]
      summary: Delete a user (admin only)
      description: |
        Cascades to the user's sessions and API keys. Refuses to delete
        the last enabled admin.
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/users/{id}/reset-password:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: resetUserPassword
      tags: [admin]
      summary: Reset a user's password (admin only)
      description: |
        Sets a new admin-chosen temporary password and forces the user to
        change it on next login (must_change_password=true), mirroring the
        invite flow. Any admin may reset any user, including another admin.
        The target user's existing sessions are revoked.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetUserPasswordRequest"
      responses:
        "200":
          description: Password reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/admin/login-locks:
    get:
      operationId: listLoginLocks
      tags: [admin]
      summary: List active login rate-limit locks (admin only)
      description: |
        Returns the in-memory login-limiter counters that are currently at or
        over their threshold — the IPs and (IP, email) pairs a login would be
        rejected for right now with 429. State is per-process and self-heals as
        the sliding windows expire, so this is a point-in-time snapshot.
      responses:
        "200":
          description: Active locks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginLockListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/login-locks/reset:
    post:
      operationId: resetLoginLock
      tags: [admin]
      summary: Clear a login rate-limit lock (admin only)
      description: |
        Lifts a single lock surfaced by `GET /admin/login-locks`. `type` picks
        the counter: `ip` clears the per-IP horizontal-sweep counter; `ip_email`
        clears the per-(IP, email) counter for one account. The admin selects
        the exact row to clear — the server never clears across keys.
        Idempotent: clearing a key that is no longer locked returns 204.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetLoginLockRequest"
      responses:
        "204":
          description: Lock cleared (or already absent)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/admin/runtime-config:
    get:
      operationId: getRuntimeConfig
      tags: [admin]
      summary: Read effective runtime config (admin only)
      description: |
        Returns the resolved runtime config (DB row → env → recommended) the
        sidecar is currently configured against, plus a `source` map labelling
        each field's origin so the dashboard can render the "DB" / "Env" /
        "Recommended" pill next to every value.
      responses:
        "200":
          description: Effective runtime config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeConfig"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      operationId: putRuntimeConfig
      tags: [admin]
      summary: Save runtime config overrides (admin only)
      description: |
        Replaces the runtime_settings row. Fields omitted from the request
        clear their override (= fall back to env / recommended on next Get).
        Does NOT restart the sidecar — the dashboard issues a separate
        POST /admin/sidecar/restart after a successful PUT.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuntimeConfigUpdate"
      responses:
        "200":
          description: Updated config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeConfig"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/admin/sidecar/restart:
    post:
      operationId: restartSidecar
      tags: [admin]
      summary: Restart the llama-server sidecar (admin only)
      description: |
        Drains the embedding queue (30s timeout), terminates the current
        child process, and respawns with the latest runtime config.
        Returns 202 immediately; poll GET /admin/sidecar/status to observe
        the running → restarting → running transition. In-flight indexing
        batches at the moment of restart will fail with ErrSupervisor and
        must be re-driven by the operator (`cix reindex <project>`).
      responses:
        "202":
          description: Restart accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestartAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description: Embeddings disabled at boot — restart is a no-op
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/admin/sidecar/status:
    get:
      operationId: getSidecarStatus
      tags: [admin]
      summary: Sidecar process status (admin only)
      responses:
        "200":
          description: Status snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SidecarStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/models:
    get:
      operationId: listModels
      tags: [admin]
      summary: List GGUF model files cached on disk (admin only)
      description: |
        Walks `CIX_GGUF_CACHE_DIR` and returns one entry per .gguf file. Used
        by the dashboard's embedding-model picker so admins don't have to
        type HF repo IDs by hand. Empty list when the cache is empty —
        dashboard falls back to a free-text path input in that case.
      responses:
        "200":
          description: Cached model list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/resources:
    get:
      operationId: getResourceUsage
      tags: [admin]
      summary: Report memory and disk usage (admin only)
      description: |
        What the server is using right now: Go heap figures, resident set size
        where the platform exposes it cheaply, the four storage locations with
        their sizes and free space, and the resident vector-store totals.

        The vector store is an in-memory database — every document of every
        collection is decoded into the heap at startup and never evicted — so
        `memory.heap_alloc_bytes` tracks the size of the loaded index almost
        one-for-one, and `vector_store.documents` is the number that explains
        it. Document counts are read from memory and free; the directory sizes
        are real filesystem walks and can take several seconds on a large
        index, so render this behind a loading state rather than polling it.
      responses:
        "200":
          description: Current usage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceUsage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ResourcesUnavailable"

  /api/v1/admin/resources/analyze:
    post:
      operationId: analyzeReclaimable
      tags: [admin]
      summary: Find reclaimable garbage (admin only)
      description: |
        Reconciles what is on disk and in memory against what the database
        still knows about, and returns the reclaimable garbage grouped into
        categories the admin can select individually.

        Synchronous and expensive — it walks the vector store and the clone
        directory. Concurrent calls collapse into a single scan.

        The returned `analysis_id` is passed back to
        `POST /api/v1/admin/resources/clean`. It is an identity for "the
        picture the admin was shown", not a safety mechanism: every item is
        re-validated against live state immediately before it is deleted, so a
        project that comes back between analyze and clean is skipped rather
        than wiped.
      responses:
        "200":
          description: Analysis complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReclaimAnalysis"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ResourcesUnavailable"

  /api/v1/admin/resources/clean:
    post:
      operationId: cleanResources
      tags: [admin]
      summary: Delete the selected reclaimable categories (admin only)
      description: |
        Deletes the selected categories from a previous analysis.

        Returns `200` even when individual items failed or were skipped — the
        per-category counts carry that detail, and failing the whole call would
        hide the items that were successfully reclaimed. `409` means the
        analysis expired or was already spent; re-run analyze.

        Deleting orphaned collections releases heap immediately — the server
        forces a GC afterwards, so `heap_alloc_bytes` drops right away. How far
        `rss_bytes` follows is platform-dependent: on Linux the pages go back to
        the OS and resident memory drops with the heap; on macOS they are marked
        reclaimable and stay resident until something else needs them.
        Everything else is disk only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CleanRequest"
      responses:
        "200":
          description: Clean finished (possibly with per-item failures)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CleanResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/ResourcesUnavailable"

  /api/v1/admin/database:
    get:
      operationId: getDatabaseState
      tags: [admin]
      summary: Report SQLite size, wasted space and compaction advice (admin only)
      description: |
        Deleting rows does not shrink a SQLite file. The pages go on the
        freelist and are reused by later writes, so a database that has lost
        more data than it has since gained stays large and mostly empty. This
        endpoint reports how much of the file is waste and whether it is worth
        doing anything about it.

        Cheap: `page_count` and `freelist_pages` are header reads, not scans,
        so this is safe to poll.

        `auto_vacuum` is a property of the database file itself, not a stored
        setting — it is read live, so it always reflects reality even on a
        server that was upgraded into this feature. `none` means the file can
        only be shrunk by a full rebuild; `incremental` means free pages can
        additionally be returned to the filesystem in small bounded chunks
        (see `POST /api/v1/admin/database/reclaim`).

        `blocked_reason` is non-null when compaction cannot start right now —
        an indexing or clone job is in flight, or the filesystem does not have
        room for the copy. Render it instead of enabling the button.
      responses:
        "200":
          description: Current database state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabaseState"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ResourcesUnavailable"

  /api/v1/admin/database/compact:
    post:
      operationId: compactDatabase
      tags: [admin]
      summary: Rebuild the database to reclaim free pages (admin only)
      description: |
        Starts a background rebuild and returns immediately with `202`. Poll
        `GET /maintenance/status` for progress.

        What the admin is agreeing to, and what the confirmation dialog must
        say before this is called:

        * For the long part the server is **read-only**, not down. Search,
          browsing and every read keep working. New logins and every write are
          rejected with `503` and a `Retry-After`; indexing and scheduled
          polling pause. Existing sessions and API keys keep working — their
          last-seen timestamps simply stop being refreshed for the duration,
          which is invisible against a 14-day session lifetime.
        * Then the server **restarts itself** to adopt the new file, and is
          fully unavailable while it comes back up.
        * Expect roughly a minute per 8 GB on a warm SSD for the copy, plus
          the usual startup time; `estimated_seconds` on `DatabaseState`
          carries the current estimate.

        The restart is not a fallback, it is the mechanism. Swapping the file
        under a live server would leave every service holding an open handle
        to the old one, so the swap is performed at boot, before anything
        opens the database — no pool, no services, no concurrency. The process
        re-executes itself rather than exiting, so a container keeps its PID 1
        and no restart policy or supervisor is involved.

        The read-only window matters because the rebuild copies a *snapshot*:
        anything committed after the copy begins is absent from the new file,
        and swapping it in would silently discard those writes. It is enforced
        in three layers rather than one, because the obvious single mechanism
        is wrong in both available forms.

        A route gate refuses the endpoints that write, and is what keeps
        latency sane — it is classified per route, never by HTTP method, since
        search is a POST and is one of the things that must keep working.
        Background work is stopped and drained before the copy starts. Finally
        the compactor holds a write transaction on a connection of its own, so
        anything that slips past the first two layers is refused by SQLite
        itself rather than landing outside the snapshot.

        Compaction does not change the database's reclaim mode. It reclaims
        space and leaves the mode exactly as it found it — that is a separate
        setting, changed through
        `PUT /api/v1/admin/database/auto-vacuum`.

        Crash safety: progress is journalled to a state file beside the
        database, written atomically, and every combination of that state and
        the files actually present on disk maps to exactly one recovery
        action. An interrupted copy is discarded; an interrupted swap is
        carried forward or rolled back. The original is deleted last, so no
        interruption leaves the server without a database. Nothing is resumed
        — the operation is all-or-nothing and is simply re-run.

        The state lives in a file rather than a table precisely because the
        database is the thing being replaced: a row describing the operation
        could not survive the swap, could not be written during the read-only
        window, and could not be read back during the restart.
      responses:
        "202":
          description: Compaction started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaintenanceOperation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: |
            Already running, or held back because clone/index jobs are in
            flight. `DatabaseState.blocked_reason` carries the same detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "507":
          $ref: "#/components/responses/InsufficientStorage"
        "503":
          $ref: "#/components/responses/ResourcesUnavailable"

  /api/v1/admin/database/reclaim:
    post:
      operationId: reclaimFreePages
      tags: [admin]
      summary: Return free pages to the filesystem in bounded chunks (admin only)
      description: |
        Runs `PRAGMA incremental_vacuum`, which moves free pages to the end of
        the file, followed by a WAL checkpoint. Synchronous, bounded and
        cheap: it holds an ordinary write lock for the pages it moves, not an
        exclusive lock on the whole database, so it does not need a
        maintenance window.

        The checkpoint is part of the operation, not an extra. In WAL mode the
        page moves and the truncation both land in the log, so the database
        file does not shrink until the log is folded back in — without it a
        small reclaim reports bytes freed while the file on disk is unchanged.

        Requires the file to be in incremental auto-vacuum mode; `409`
        otherwise, with compaction as the remedy.

        This reclaims space but does not defragment — a full compaction still
        rebuilds the file and improves read locality. The point of incremental
        reclaim is to make that rare rather than routine.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReclaimRequest"
      responses:
        "200":
          description: Reclaim finished
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReclaimResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: The database is not in incremental auto-vacuum mode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/ResourcesUnavailable"

  /api/v1/admin/database/checkpoint:
    post:
      operationId: checkpointWal
      tags: [admin]
      summary: Fold the write-ahead log back into the database (admin only)
      description: |
        Runs `PRAGMA wal_checkpoint(TRUNCATE)`. Seconds at most, no maintenance
        window, and it only moves data that is already durable — the cheap
        first thing to try when the `-wal` file has grown large.

        A checkpoint can be blocked by long-running readers, in which case it
        returns what it managed to move rather than failing.
      responses:
        "200":
          description: Checkpoint finished
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckpointResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ResourcesUnavailable"

  /api/v1/admin/database/auto-vacuum:
    put:
      operationId: setAutoVacuumMode
      tags: [admin]
      summary: Change the database's reclaim mode (admin only)
      description: |
        Incremental mode lets free pages be returned to the filesystem without
        a rebuild — it is what makes
        `POST /api/v1/admin/database/reclaim` possible. It is not free: it
        maintains pointer-map pages, so every page allocated or freed carries
        an extra write, measured at +1.5% on an indexing-shaped workload.

        **Asking for the mode the database is already in does nothing** and
        answers `200`. Only an actual change costs anything.

        A change costs a full rebuild, in either direction, because that is
        the only way SQLite can change the mode of a populated database. So a
        `202` here means the same interruption as
        `POST /api/v1/admin/database/compact`: a read-only window, then a
        restart. The space that rebuild happens to reclaim is a side effect,
        not the point.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutoVacuumRequest"
      responses:
        "200":
          description: |
            The database is already in the requested mode. Nothing was done and
            the returned operation is `idle`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaintenanceOperation"
        "202":
          description: A rebuild has started to apply the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaintenanceOperation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: |
            Already running, or held back because clone/index jobs are in
            flight.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "507":
          $ref: "#/components/responses/InsufficientStorage"
        "503":
          $ref: "#/components/responses/ResourcesUnavailable"

  /api/v1/admin/schedules:
    get:
      operationId: listSchedules
      tags: [admin]
      summary: List every recurring task and when it next runs (admin only)
      description: |
        One entry per task the server knows how to run on a schedule. The
        timing is a crontab expression, and `next_runs` is computed by the
        same parser that will actually fire it — a client must not evaluate
        the expression itself, or its preview and the server's behaviour can
        disagree.

        `configured` is false while a task is still on its built-in or
        environment default, which is how an upgraded server reports
        automation nobody has opted into.
      responses:
        "200":
          description: Registered tasks
          content:
            application/json:
              schema:
                type: object
                required: [tasks]
                properties:
                  tasks:
                    type: array
                    items:
                      $ref: "#/components/schemas/ScheduledTask"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ResourcesUnavailable"

  /api/v1/admin/schedules/{name}:
    put:
      operationId: updateSchedule
      tags: [admin]
      summary: Change when a recurring task runs (admin only)
      description: |
        Absent fields are left unchanged.

        An expression that parses but can never match — 30 February is the
        honest example — is refused with `422` rather than accepted as a
        schedule that silently never fires. Saving re-arms the task
        immediately, so the next run returned here is the one the server will
        actually keep.

        Timing is interpreted in the server's local timezone. Crontab
        semantics apply: a slot that passes while the process is not running
        is not queued up and fired late, except for tasks that declare
        `catch_up` — those are cheap enough that running one late is better
        than a laptop asleep at 00:00 never running them at all.
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
          description: Task identifier, e.g. `db.reclaim`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleUpdate"
      responses:
        "200":
          description: The task as it now resolves
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduledTask"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/ResourcesUnavailable"


  /maintenance/status:
    get:
      operationId: getMaintenanceStatus
      tags: [system]
      summary: Progress of a running maintenance operation (public)
      description: |
        Public and deliberately so. It reads a state file next to the database
        and touches neither the database nor the session table, so it answers
        throughout the read-only window and again the moment the restarted
        server is listening. Anything authenticated would `401` while sessions
        are unwritable, and anything DB-backed would block behind the freeze.

        It cannot answer *during* the restart itself: the router is built
        after the database is opened and the listener binds at the end of
        startup, so a client sees a connection failure until the server is
        back. A poller is expected to render that as "reconnecting" rather
        than as an error — the journal it reads is durable, so the first
        successful poll after the gap reports what happened.

        This is also how the result of a compaction reaches the dashboard at
        all: the outcome is only known after the snapshot the new database was
        built from, so it exists in the state file and nowhere else.

        `phase` is `idle` when nothing is happening. `interrupted` means a
        previous run did not finish and the next boot brought the database
        back to a consistent state; it is informational, not an error to
        clear.
      responses:
        "200":
          description: Current maintenance state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaintenanceOperation"

  /api/v1/admin/embedding-providers:
    get:
      operationId: listEmbeddingProviders
      tags: [admin]
      summary: List registered embedding-provider kinds (admin only)
      description: |
        Returns one entry per registered provider kind with its config
        schema and the names of the env vars it reads for credentials,
        plus whether those env vars are currently set on the server.
        The dashboard uses this to render the kind dropdown, the
        per-kind form, and the "set CIX_VOYAGE_API_KEY before saving"
        banner when a key is missing.
      responses:
        "200":
          description: List of registered providers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmbeddingProviderList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/embedding-providers/active:
    get:
      operationId: getActiveEmbeddingProvider
      tags: [admin]
      summary: Get the currently active embedding provider (admin only)
      description: |
        Returns the persisted provider selection (kind + JSON config
        blob) and the live `Provider.ID()` fingerprint. API keys are
        never persisted, so the config blob carries env-var NAMES
        only — safe to surface to admin clients verbatim.
      responses:
        "200":
          description: Currently active provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveEmbeddingProvider"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description: Embeddings service not wired (e.g. CIX_EMBEDDINGS_ENABLED=false)
    put:
      operationId: switchEmbeddingProvider
      tags: [admin]
      summary: Switch to a different embedding provider (admin only)
      description: |
        Atomic switch. The server validates the submitted config, persists
        it, then swaps the live Service over (drains the queue first).
        On any error the existing provider stays untouched.

        Switching changes the active `Provider.ID()` fingerprint; every
        project's `indexed_with_model` becomes stale and the next
        clone job per project triggers a full reindex
        (`mode=full, reason=model-change`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SwitchEmbeddingProviderRequest"
      responses:
        "202":
          description: Switch accepted; new provider is live
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveEmbeddingProvider"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/embedding-providers/{kind}/test:
    post:
      operationId: testEmbeddingProvider
      tags: [admin]
      summary: Validate an embedding-provider config without persisting (admin only)
      description: |
        Builds a throw-away provider from the submitted config, calls
        Start (one short embed for HTTP providers; spawning a child for
        ollama), then Stops it. Returns the detected dimension and an
        ok flag. Use this from the dashboard before calling PUT
        /embedding-providers/active so the admin sees an actionable
        error (bad key, wrong URL, missing env var) before the swap.
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            type: string
            enum: [ollama, openai, voyage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Provider-specific config blob (shape varies by kind).
              additionalProperties: true
      responses:
        "200":
          description: Connect test succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestEmbeddingProviderResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          description: |
            Connect test failed against the upstream service (auth
            rejected, network unreachable, etc).

  /api/v1/api-keys:
    get:
      operationId: listApiKeys
      tags: [api-keys]
      summary: List my API keys (or all keys if admin)
      parameters:
        - name: owner
          in: query
          required: false
          description: |
            `all` — admin-only, returns every key in the system.
            Anything else (or unset) returns the caller's keys.
          schema:
            type: string
            enum: [all]
      responses:
        "200":
          description: Key list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createApiKey
      tags: [api-keys]
      summary: Issue a new API key
      description: |
        Returns the **plaintext** `full_key` exactly once in the response.
        The dashboard shows it with a copy button and a "this is the only
        time you will see this value" warning. Subsequent reads only
        return the `prefix`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiKeyRequest"
      responses:
        "201":
          description: Key created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyCreated"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/api-keys/{id}:
    delete:
      operationId: revokeApiKey
      tags: [api-keys]
      summary: Revoke an API key
      description: |
        The owner can revoke their own keys. An admin can revoke any
        key. Revoking is permanent — the row stays in the table marked
        with `revoked_at` so the audit trail is preserved, but
        subsequent Bearer auth attempts with the value fail with 401.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/projects:
    post:
      operationId: createProject
      tags: [projects]
      summary: Register a new project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            The caller's account has `local_project_disabled=true`
            (cannot create local projects). Admins are exempt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A project with this `host_path` already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      operationId: listProjects
      tags: [projects]
      summary: List all registered projects
      responses:
        "200":
          description: Project list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/projects/{path}:
    parameters:
      - $ref: "#/components/parameters/ProjectHash"
    get:
      operationId: getProject
      tags: [projects]
      summary: Get one project by hash
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Patch project settings (admin only)
      description: |
        Admin-only. Settings changes can shrink the indexing surface
        (exclude_patterns, max_file_size); viewers must not be able to
        silently de-index a project.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectRequest"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete a project and all its indexed data (admin only)
      description: |
        Admin-only. Drops the project plus its symbols, refs, file hashes,
        and embeddings. Destructive enough that viewer-scoped sessions and
        API keys must not reach it.
      responses:
        "204":
          description: Deleted (no body)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/projects/{path}/summary:
    parameters:
      - $ref: "#/components/parameters/ProjectHash"
    get:
      operationId: getProjectSummary
      tags: [projects]
      summary: Project overview (top dirs, recent symbols, totals)
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/projects/{path}/file:
    parameters:
      - $ref: "#/components/parameters/ProjectHash"
    post:
      operationId: readProjectFile
      tags: [projects]
      summary: Read a file (whole or line range) from an external project's checkout
      description: |
        Returns the contents of a file from the server-side git checkout of an
        EXTERNAL (GitHub-backed) project. LOCAL projects are not served — their
        files live on the caller's machine, not on the server — and return 409
        with a `detail` telling the caller to read the file with their own
        filesystem tools. Omit `start`/`end` to read the whole file; otherwise
        both are 1-based inclusive line numbers. Output is capped by server
        size/line limits (`truncated: true` when hit).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FileReadRequest"
      responses:
        "200":
          description: File content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileContent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            The project is local (its files are not on the server) or its
            checkout is not yet available. `detail` explains which and what
            to do instead.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/projects/{path}/tree:
    parameters:
      - $ref: "#/components/parameters/ProjectHash"
    post:
      operationId: listProjectTree
      tags: [projects]
      summary: List a directory (one level) in an external project's checkout
      description: |
        Lists the immediate entries of a directory in the server-side git
        checkout of an EXTERNAL (GitHub-backed) project — ls-like, one level,
        no recursion. Omit `dir` (or pass empty) for the repo root. LOCAL
        projects return 409 (see the file endpoint). Entry count is capped
        (`truncated: true` when hit); the `.git` directory is omitted.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TreeRequest"
      responses:
        "200":
          description: Directory listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectoryListing"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            The project is local or its checkout is not yet available.
            `detail` explains which and what to do instead.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/projects/{path}/workspaces:
    parameters:
      - $ref: "#/components/parameters/ProjectHash"
    get:
      operationId: listProjectWorkspaces
      tags: [projects]
      summary: List workspaces that contain this project
      description: |
        Returns every workspace that has this project attached, owned or
        linked. The project page uses this to show "Workspaces" chips
        the user can click to jump to the workspace detail page.

        Empty list when the project isn't part of any workspace yet —
        either it was indexed directly via /projects without ever being
        linked, or all its memberships have been detached.
      responses:
        "200":
          description: Memberships
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectWorkspaceList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/projects/{path}/search:
    parameters:
      - $ref: "#/components/parameters/ProjectHash"
    post:
      operationId: semanticSearch
      tags: [search]
      summary: Semantic (vector) search
      description: |
        Embeds the query and runs an approximate nearest-neighbour search
        against the project's chromem-go collection. Results are
        post-filtered by `min_score`, `paths` (whitelist, prefix-OR-substring
        match), `excludes` (blacklist, same matching), and `languages` —
        then merged into per-file groups and ranked by best match score.

        `min_score` semantics:
          - omitted → server default `0.2` (light relevance floor that
            doesn't silently drop abstract natural-language queries
            whose best chunks score in [0.25, 0.35])
          - explicit `0` → return everything above HNSW floor
          - explicit positive → that floor (use `0.4+` for strict
            code-symbol searches calibrated for CodeRankEmbed-Q8)

        `query_time_ms` is rounded to 1 decimal place.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SemanticSearchRequest"
      responses:
        "200":
          description: Per-file grouped semantic results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SemanticSearchResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          description: |
            Embeddings disabled, vector store missing, or sidecar busy
            (Retry-After header set).
          headers:
            Retry-After:
              schema: { type: integer }
              description: Seconds to wait when the embedder is busy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/projects/{path}/search/symbols:
    parameters:
      - $ref: "#/components/parameters/ProjectHash"
    post:
      operationId: searchSymbols
      tags: [search]
      summary: Symbol search by name (prefix/substring)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SymbolSearchRequest"
      responses:
        "200":
          description: Matching symbols
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SymbolSearchResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/projects/{path}/search/definitions:
    parameters:
      - $ref: "#/components/parameters/ProjectHash"
    post:
      operationId: searchDefinitions
